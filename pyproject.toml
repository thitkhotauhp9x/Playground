[project]
name = "playground"
version = "0.1.0"
description = ""
authors = [
    {name = "manhdt",email = "thitkhotau.no1@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "langchain (>=1.3.0,<2.0.0)",
    "langchain-openai (>=1.2.1,<2.0.0)",
    "openai (>=2.0.0,<3.0.0)",
    "gtts (>=2.5.4,<3.0.0)",
    "markdown-it-py (>=4.2.0,<5.0.0)",
    "nltk (>=3.10.0,<4.0.0)",
    "dspy (>=3.2.1,<4.0.0)",
    "langchain-classic (>=1.0.8,<2.0.0)",
    "beautifulsoup4 (>=4.15.0,<5.0.0)",
    "selenium (>=4.46.0,<5.0.0)",
    "webdriver-manager (>=4.1.2,<5.0.0)",
    "html2image (>=2.0.7,<3.0.0)",
    "imgkit (>=1.2.3,<2.0.0)",
    "sqlmodel (>=0.0.39,<0.0.40)",
    "fastapi[standard] (>=0.141.1,<0.142.0)",
    "sympy (>=1.14.0,<2.0.0)",
    "google-api-python-client (>=2.200.0,<3.0.0)",
    "google-api-core (>=2.40.0,<3.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "pyefd (>=1.8.0,<2.0.0)",
    "opencv-python (>=5.0.0.93,<6.0.0.0)",
    "langchain-core (>=1.7.3,<2.0.0)",
]

[tool.poetry]
packages = [{include = "app", from = "src"}]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I"]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.20,<0.16.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "pylint (>=4.1.3,<5.0.0)",
    "pyright (>=1.1.414,<2.0.0)",
    "pyupgrade (>=3.22.0,<4.0.0)",
    "isort (>=9.0.2,<10.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)",
    "pytest (>=9.2.0,<10.0.0)"
]
